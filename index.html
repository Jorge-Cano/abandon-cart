<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Luxury - Modern Apparel</title>

    <style>
        :root {
            --primary: #111827;
            --accent: #2563eb;
            --danger: #dc2626;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --success: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        /* Navigation */
        header { background: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.05em; }
        nav { display: flex; gap: 1.5rem; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.5rem; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 10; border-radius: 4px; overflow: hidden; }
        .dropdown-content a { color: var(--text); padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .dropdown:hover .dropdown-content { display: block; }
        
        .cart-btn { background: var(--accent); border: none; color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }

        /* Product Layout */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; flex: 1; }
        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.1rem; color: #4b5563; margin-bottom: 1rem; }
        .add-cart-btn { margin-top: auto; background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Toast Container & Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #ffffff;
            border-left: 4px solid var(--success);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 0.85rem 1.25rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            transform: translateX(120%);
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-icon {
            background: #ecfdf5;
            color: var(--success);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Checkout Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; }

        /* Error Box */
        .error-banner { display: none; background: #fee2e2; border: 1px solid var(--danger); color: #991b1b; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-weight: bold; }
        
        .checkout-btn { background: var(--success); color: white; border: none; padding: 0.85rem; border-radius: 6px; width: 100%; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .close-btn { background: transparent; border: none; font-size: 1.2rem; float: right; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Toast Notification Anchor -->
    <div class="toast-container" id="toast-container"></div>

    <header>
        <div class="logo">AURA</div>
        <nav>
            <div class="dropdown">
                <button class="dropbtn">Categories ▾</button>
                <div class="dropdown-content">
                    <a href="#apparel">Apparel</a>
                    <a href="#accessories">Timepieces & Gold</a>
                    <a href="#footwear">Footwear</a>
                </div>
            </div>
            <button class="cart-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Autumn / Winter Collection</h1>
            <p>Elevate your everyday aesthetic with curated minimalist luxury.</p>
        </section>

        <section class="grid" id="product-grid"></section>
    </main>

    <!-- Checkout Modal -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeCart()">&times;</button>
            <h2>Checkout</h2>
            <hr style="margin: 1rem 0;">
            
            <div id="cart-items-summary" style="margin-bottom: 1rem;"></div>

            <!-- Failure Alert Box -->
            <div id="error-banner" class="error-banner">
                🔥🗑️ Oops! A dumpster fire occurred. Your request was lost in the void.
            </div>

            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" value="Jorge Cano" required>
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" value="123 Innovation Way, San Antonio, TX" required>
                </div>
                <div class="form-group">
                    <label>Card Number (Mock)</label>
                    <input type="text" value="4242 •••• •••• 4242" required>
                </div>
                <button type="submit" id="submit-btn" class="checkout-btn">Complete Purchase</button>
            </form>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Minimalist Gold Timepiece", price: 350, img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Structured Tailored Blazer", price: 280, img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Leather Tote Bag", price: 195, img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">$${p.price}</div>
                        <button class="add-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function showToast(productName) {
            const container = document.getElementById('toast-container');
            
            // Create toast element
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-icon">✓</div>
                <div>Added <strong>${productName}</strong> to cart!</div>
            `;
            
            container.appendChild(toast);

            // Animate in
            setTimeout(() => toast.classList.add('show'), 50);

            // Animate out and remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            localStorage.setItem('aura_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
            
            // Display success pop-up toast
            showToast(product.name);

            // FullStory Custom Event Hook (if loaded)
            if (window.FS && window.FS.event) {
                window.FS.event('Add to Cart', { product_id: id, name: product.name, price: product.price });
            }
        }

        function openCart() {
            const summary = document.getElementById('cart-items-summary');
            if (cart.length === 0) {
                summary.innerHTML = "<p>Your cart is empty.</p>";
            } else {
                summary.innerHTML = cart.map(i => `<p>• ${i.name} - <strong>$${i.price}</strong></p>`).join('');
            }
            document.getElementById('checkout-modal').classList.add('active');
        }

        function closeCart() {
            document.getElementById('checkout-modal').classList.remove('active');
        }

        function handleCheckout(e) {
            e.preventDefault();
            console.warn("[DEMO] Purchase button clicked. Initiating mock network payload...");

            // Simulated failing network endpoint request
            fetch('https://api.aurademo.internal/v1/checkout/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart: cart, timestamp: Date.now() })
            })
            .catch(err => {
                // Log dead click / Network Failure explicitly to console
                console.error("[CRITICAL FAILURE] 500 Internal Server Error - Endpoint unreachable: /v1/checkout/process");
                console.error("Payload execution halted. Uncaught TypeError: Cannot read properties of undefined (reading 'processPayment')");
                
                // Track Dead Click/Failure in FullStory if present
                if (window.FS && window.FS.event) {
                    window.FS.event('Checkout Error Encountered', { error_type: 'Dead Click / 500 Network Failure' });
                }

                // Render UI Dumpster Fire Error
                const banner = document.getElementById('error-banner');
                banner.style.display = 'block';
            });
        }

        // Initialize
        renderProducts();
    </script>
</body>
</html>
